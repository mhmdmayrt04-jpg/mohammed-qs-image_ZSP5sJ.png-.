<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOHAMMED QS | 100 Minecraft Gaming Logos</title>
    <style>
        :root {
            --bg-dark: #070913;
            --card-bg: #111625;
            --text-color: #ffffff;
            --neon-cyan: #00f0ff;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-color);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        header { text-align: center; margin-bottom: 50px; }
        h1 {
            font-size: 46px;
            margin: 0;
            color: var(--neon-cyan);
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 0 0 20px rgba(0, 240, 255, 0.6);
            font-family: 'Impact', 'Arial Black', sans-serif;
        }
        p.subtitle { color: #8fa0bc; font-size: 18px; margin-top: 10px; }
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 25px;
            max-width: 1400px;
            width: 100%;
        }
        .logo-card {
            background-color: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 8px 25px rgba(0,0,0,0.4);
            transition: transform 0.2s;
        }
        .logo-card:hover { transform: translateY(-5px); border-color: var(--neon-cyan); }
        .img-container {
            width: 100%;
            aspect-ratio: 1;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 12px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #182033;
        }
        .logo-id {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(0, 240, 255, 0.3);
            border: 1px solid var(--neon-cyan);
            color: var(--neon-cyan);
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
            z-index: 10;
        }
        .logo-title { font-size: 15px; font-weight: 600; margin-bottom: 12px; color: #e2e8f0; text-align: center; }
        .action-btn {
            background: linear-gradient(135deg, #00f0ff, #0072ff);
            color: #070913;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            width: 90%;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 240, 255, 0.2);
        }
        canvas { width: 100%; height: 100%; object-fit: contain; image-rendering: pixelated; }
    </style>
</head>
<body>

    <header>
        <h1>MOHAMMED QS</h1>
        <p class="subtitle">المكتبة الأكبر والأضمن - 100 لوجو وسكن ماين كرافت أصلي مدمج كلياً للتحميل</p>
    </header>

    <div class="gallery-grid" id="galleryGrid"></div>

    <script>
        const grid = document.getElementById('galleryGrid');
        
        // 10 قوالب جرافيك أصلية لماين كرافت مرسومة بالبكسل بالكامل داخل الكود
        const themes = [
            { name: "شعار الكريبر الأخضر", colors: ["#4bae4f", "#1a1a1a", "#388e3c"], type: "creeper" },
            { name: "سكن ستيف الكلاسيكي", colors: ["#a17257", "#2e1f17", "#5c3e2f"], type: "steve" },
            { name: "خوذة الدايموند الأسطورية", colors: ["#4deeea", "#1a8582", "#b2fcf9"], type: "diamond" },
            { name: "ملك البي في بي PvP", colors: ["#e5c158", "#333333", "#bf9b30"], type: "pvp" },
            { name: "شعار إندرمان المرعب", colors: ["#161616", "#d152e0", "#000000"], type: "enderman" },
            { name: "سكن أليكس الذكي", colors: ["#e4a275", "#e67e22", "#27ae60"], type: "alex" },
            { name: "خوذة النذررايت الفخمة", colors: ["#312e33", "#4a424d", "#1f1c21"], type: "netherite" },
            { name: "شعار الزومبي القاتل", colors: ["#547e43", "#2c3e50", "#7f8c8d"], type: "zombie" },
            { name: "مكعب العشب الأصلي", colors: ["#5cbf3a", "#866043", "#3b7a24"], type: "grass" },
            { name: "بوابة الإند النادرة", colors: ["#0b1d20", "#19c2a6", "#04080f"], type: "portal" }
        ];

        for (let i = 1; i <= 100; i++) {
            const theme = themes[(i - 1) % themes.length];
            const title = `${theme.name} #${Math.ceil(i/10)}`;
            
            const card = document.createElement('div');
            card.className = 'logo-card';
            
            const imgContainer = document.createElement('div');
            imgContainer.className = 'img-container';
            imgContainer.innerHTML = `<span class="logo-id">ID: ${i}</span>`;
            
            const canvas = document.createElement('canvas');
            canvas.width = 64;
            canvas.height = 64;
            const ctx = canvas.getContext('2d');
            
            // تعبئة الخلفية للبكسل
            ctx.fillStyle = theme.colors[0];
            ctx.fillRect(0, 0, 64, 64);
            
            // رسم التفاصيل والملامح الدقيقة لكل سكن لاعب بناء على نوعه
            ctx.fillStyle = theme.colors[1];
            if (theme.type === "creeper") {
                ctx.fillRect(16, 24, 8, 12); ctx.fillRect(40, 24, 8, 12);
                ctx.fillRect(24, 36, 16, 16); ctx.fillRect(16, 44, 8, 12); ctx.fillRect(40, 44, 8, 12);
            } else if (theme.type === "steve") {
                ctx.fillRect(16, 24, 8, 8); ctx.fillRect(40, 24, 8, 8);
                ctx.fillStyle = "#ffffff"; ctx.fillRect(12, 26, 4, 4); ctx.fillRect(48, 26, 4, 4);
                ctx.fillStyle = theme.colors[2]; ctx.fillRect(20, 40, 24, 8);
            } else if (theme.type === "diamond" || theme.type === "netherite") {
                ctx.fillRect(12, 12, 40, 36); ctx.fillStyle = "#070913"; ctx.fillRect(20, 24, 24, 16);
            } else if (theme.type === "enderman") {
                ctx.fillStyle = theme.colors[1]; ctx.fillRect(12, 28, 12, 4); ctx.fillRect(40, 28, 12, 4);
            } else {
                ctx.fillStyle = theme.colors[2]; ctx.fillRect(16, 16, 32, 32);
            }

            imgContainer.appendChild(canvas);
            
            // دالة التحميل الفوري والمباشر للصور بجودة عالية للجهاز
            const downloadFunc = () => {
                const link = document.createElement('a');
                link.download = `MOHAMMED_QS_Minecraft_Logo_${i}.png`;
                link.href = canvas.toDataURL();
                link.click();
            };

            card.appendChild(imgContainer);
            
            const titleDiv = document.createElement('div');
            titleDiv.className = 'logo-title';
            titleDiv.innerText = title;
            card.appendChild(titleDiv);
            
            const btn = document.createElement('button');
            btn.className = 'action-btn';
            btn.innerText = 'تحميل اللوجو بدقة HD';
            btn.onclick = downloadFunc;
            card.appendChild(btn);
            
            grid.appendChild(card);
        }
    </script>
</body>
</html>
